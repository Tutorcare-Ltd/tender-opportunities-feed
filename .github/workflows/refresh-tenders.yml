name: Refresh tender opportunities

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate updater
        run: npm run check
      - name: Refresh public feed
        run: npm run refresh
      - name: Commit successful snapshot
        run: |
          git config user.name "Tutorcare Tender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/latest.json docs/health.json
          git diff --cached --quiet || git commit -m "Refresh tender opportunities"
          git push
