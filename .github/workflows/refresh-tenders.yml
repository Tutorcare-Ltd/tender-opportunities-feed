name: Refresh tender opportunities

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate updater
        run: npm run check
      - name: Refresh protected feed
        run: npm run refresh
      - name: Publish snapshot to private dashboard bridge
        env:
          TENDER_UPDATE_URL: ${{ secrets.TENDER_UPDATE_URL }}
        run: |
          test -n "$TENDER_UPDATE_URL"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @docs/latest.json \
            "$TENDER_UPDATE_URL"
