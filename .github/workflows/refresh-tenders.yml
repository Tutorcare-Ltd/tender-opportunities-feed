name: Refresh tender opportunities

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      catch_up_windows:
        description: "Maximum seven-day recovery windows (1 to 8)"
        type: choice
        options: ["1", "2", "4", "8"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Enable only after state migration and the companion Site contract are verified.
    if: github.ref == 'refs/heads/main' && vars.TENDER_FEED_V2_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate updater
        run: |
          npm run check
          npm test
      - name: Restore durable public feed state
        uses: actions/checkout@v4
        with:
          ref: feed-state
          path: state-store
      - name: Refresh, persist and publish each bounded window
        id: refresh
        env:
          FEED_STATE_FILE: state-store/state.json
          WINDOW_COUNT: ${{ inputs.catch_up_windows || '1' }}
          TENDER_UPDATE_URL: ${{ secrets.TENDER_UPDATE_URL }}
          SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
        run: |
          case "$WINDOW_COUNT" in 1|2|4|8) ;; *) exit 1;; esac
          git -C state-store config user.name "github-actions[bot]"
          git -C state-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ((window=1; window<=WINDOW_COUNT; window++)); do
            npm run refresh
            git -C state-store add -- state.json
            if ! git -C state-store diff --cached --quiet; then
              git -C state-store commit -m "Record tender source checkpoints and run health"
              git -C state-store push origin HEAD:feed-state
            fi
            npm run publish:feed
            if ! node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('docs/health.json')); process.exit(h.ok ? 0 : 1);"; then break; fi
            if node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync(process.env.FEED_STATE_FILE)); process.exit(Object.values(s.sourceState).every(v=>Date.now()-Date.parse(v.watermark)<600000) ? 0 : 1);"; then break; fi
          done
      - name: Report degraded upstream status
        run: node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('docs/health.json')); if(!h.ok) { console.error(h.sourceFailures.join('; ')); process.exitCode=1; }"
      - name: Retain public diagnostics
        if: always() && steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tender-feed-diagnostics
          path: |
            docs/latest.json
            docs/health.json
          retention-days: 30
